<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SOLMAR: a sun-soaked open-world crime game. Steal cars, run missions for Sofia, and lose the cops in a golden-hour city by the sea.">
<title>SOLMAR - A sun-soaked open-world crime story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: clip; background: #1a1210; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: 'Helvetica Neue', Arial, sans-serif; color: #fff; }
  #hud.menu-mode #hud-top-left, #hud.menu-mode #hud-top-right, #hud.menu-mode #objective,
  #hud.menu-mode #speed, #hud.menu-mode #weapon, #hud.menu-mode #minimap, #hud.menu-mode #message { display: none; }
  #hud-top-left { position: absolute; top: 16px; left: 16px; }
  #health-wrap { position: relative; width: 220px; height: 18px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.45); }
  #health-bar { height: 100%; width: 100%; background: #58c96b; }
  #health-text { position: absolute; right: 6px; top: 0; font-size: 12px; line-height: 18px; font-weight: 700; text-shadow: 0 1px 2px #000; }
  #cash { color: #7ee2a0; font-weight: 800; font-size: 20px; text-shadow: 0 1px 3px #000; margin-top: 6px; }
  #hud-top-right { position: absolute; top: 16px; right: 16px; text-align: right; }
  #stars { font-size: 22px; letter-spacing: 2px; text-shadow: 0 1px 3px #000; }
  #clock { opacity: 0.85; font-size: 14px; text-shadow: 0 1px 2px #000; }
  #objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); text-align: center; text-shadow: 0 1px 3px #000; max-width: 520px; }
  #obj-title { font-weight: 800; font-size: 17px; color: #ffd23e; }
  #obj-text { font-size: 14px; margin-top: 2px; }
  #speed { position: absolute; right: 20px; bottom: 24px; font-size: 22px; font-weight: 800; text-shadow: 0 1px 3px #000; }
  #weapon { position: absolute; right: 20px; bottom: 58px; font-size: 15px; font-weight: 700; text-shadow: 0 1px 3px #000; }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 22px; font-weight: 700; text-shadow: 0 0 4px #000; display: none; }
  #message { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 4px; font-size: 15px; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
  #minimap { position: absolute; left: 16px; bottom: 16px; border: 2px solid rgba(255,255,255,0.55); border-radius: 4px; }
  #vignette { position: absolute; inset: 0; box-shadow: inset 0 0 120px 40px rgba(200,20,20,0.55); opacity: 0; transition: opacity 0.4s; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(24,10,16,0.45), rgba(24,10,16,0.88)); pointer-events: auto; text-align: center; padding: 24px; }
  .hidden { display: none !important; }
  #menu h1 { font-size: 84px; letter-spacing: 14px; margin: 0; font-family: 'Arial Black', Arial, sans-serif; color: #ffd23e; text-shadow: 0 4px 0 #8a2f1f, 0 8px 24px rgba(0,0,0,0.6); text-wrap: balance; }
  .tag { font-size: 20px; color: #ffb37a; margin: 10px 0 18px; }
  .story { max-width: 560px; font-size: 16px; line-height: 1.55; opacity: 0.94; margin: 0; }
  .buttons { display: flex; gap: 12px; margin-top: 28px; }
  .buttons button { cursor: pointer; background: #ffd23e; color: #231303; border: none; padding: 14px 28px; font-size: 17px; font-weight: 800; border-radius: 4px; letter-spacing: 0.5px; }
  .buttons button:hover { background: #ffe27a; }
  .buttons button:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
  .buttons button:active { background: #f5b81e; transform: translateY(1px); }
  #how { margin-top: 24px; font-size: 14px; line-height: 1.7; background: rgba(0,0,0,0.45); padding: 16px 24px; border-radius: 6px; max-width: 640px; text-align: left; }
  #pause h2, #end h2 { font-size: 54px; letter-spacing: 8px; margin: 0 0 12px; font-family: 'Arial Black', Arial, sans-serif; text-wrap: balance; }
  #end-title { color: #e83a2e; }
  #end-text { font-size: 16px; max-width: 520px; margin: 0; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="SOLMAR: an open-world crime game. Drive, steal cars, run missions for Sofia, and lose the cops."></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
